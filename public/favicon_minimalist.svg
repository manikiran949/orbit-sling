<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Minimalist B&W Schematic -->
  <rect width="100" height="100" rx="24" fill="#000000" />
  
  <!-- Planet Core -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#ffffff" stroke-width="5" />
  
  <!-- Trajectory Orbit -->
  <ellipse cx="50" cy="50" rx="35" ry="16" fill="none" stroke="#94a3b8" stroke-width="4" transform="rotate(-35 50 50)" stroke-dasharray="8 6" />
  
  <!-- Rocket Arrow -->
  <polygon points="76,16 92,12 84,26" fill="#ffffff" />
</svg>
