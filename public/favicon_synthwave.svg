<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Neon Synthwave Style -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e0249" />
      <stop offset="100%" stop-color="#050014" />
    </linearGradient>
    <linearGradient id="orbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="url(#bg)" />
  
  <!-- Glowing Sun/Planet -->
  <circle cx="50" cy="50" r="18" fill="#f43f5e" />
  
  <!-- Wrap-around neon arc -->
  <path d="M 15 50 A 35 35 0 0 0 85 50 A 35 35 0 0 0 65 18" fill="none" stroke="url(#orbit)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Small dart/rocket -->
  <polygon points="56,11 68,10 65,22" fill="#22d3ee" />
</svg>
